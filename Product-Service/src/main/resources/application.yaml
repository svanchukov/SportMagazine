svanchukov:
  services:
    order:
      uri: http://localhost:8080

spring:
  application:
    name: product-service

  datasource:
    url: ${URL_DATASOURCE_DB:jdbc:postgresql://localhost:5434/products}
    username: ${NAME_POSTGRES:products}
    password: ${PASSWORD_POSTGRES:products}
    driver-class-name: ${DRIVER_NAME:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    change-log: classpath:db/scripts_liquibase/v.1.0.0/0000-init-table.xml
    enabled: true

  redis:
    host: localhost
    port: 6379

  logging:
    level:
      org.springframework: DEBUG
      com.zaxxer.hikari: DEBUG




eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

