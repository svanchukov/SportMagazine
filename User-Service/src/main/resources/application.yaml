server:
  port: 8083

spring:

  application:
    name: User-Service

  datasource:
    url: jdbc:postgresql://localhost:5433/user
    username: user
    password: user
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # опционально

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/scripts_liquibase/v.1.0.0/0000-init-table.xml

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

