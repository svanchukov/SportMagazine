server:
  port: 8083

spring:

  application:
    name: User-Service

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  datasource:
    url: ${URL_DATASOURCE_DB:jdbc:postgresql://localhost:5433/user}
    username: ${NAME_POSTGRES:user}
    password: ${PASSWORD_POSTGRES:user}
    driver-class-name: ${DRIVER_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}  # опционально

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${URL_EUREKA:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

