server:
  port: 8765

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/users/**
        - id : swagger
          uri: http://localhost:8083
          predicates:
            - Path=/swagger-ui/**
            - Path=/v3/api-docs/**
        - id: eureka-dashboard
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

  security:
    user:
      name: gateway
      password: 12345
  application:
    name: gateway-service
  config:
    import:


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${URL_EUREKA:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

user-service:
  url: http://localhost:8083