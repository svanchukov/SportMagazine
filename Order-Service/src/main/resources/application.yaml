server:
  port: 8081

spring:
  application:
    name: order-service # имя микросервиса для Eureka
  messages:
    basename: messages
    encoding: UTF-8



  #  boot:
#    admin:
#      client:
#        enabled: true
#        instance:
#          service-host-type: ip
#        url: http://localhost:8085

  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: product
    password: product
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

eureka:
  client:
    register-with-eureka: true  # Ставим true, чтобы сервис регистрировался в Eureka
    fetch-registry: true         # Убираем false, чтобы сервис мог получать информацию о других сервисах
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Указываем URL Eureka сервера
      instance:
        prefer-ip-address: true


management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
